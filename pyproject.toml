[project]
name = "grind-t-russian-bonds"
version = "0.1.0"
description = "Russian bonds analytics on top of T-Invest and MOEX ISS APIs"
license = "ISC"
authors = [
    { name = "grind-t", email = "grindt.gd@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "brotli>=1.2.0",
    "grind-t-cbr-ratings>=0.1.1",
    "grind-t-moex>=0.1.0",
    "grind-t-toolkit>=0.1.0",
    "httpx>=0.28.1",
    "pydantic>=2",
    "t-tech-investments>=1.51.0",
]

[project.urls]
Homepage = "https://github.com/grind-t/russian-bonds-py"
Issues = "https://github.com/grind-t/russian-bonds-py/issues"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "russian_bonds"

[tool.uv.sources]
# The official T-Invest SDK is not on PyPI, and opensource.tbank.ru is
# temporarily unavailable, so the wheel is vendored in the repo.
t-tech-investments = { path = "vendor/t_tech_investments-1.51.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# shared test helpers import as `factories`
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra", "-q"]
xfail_strict = true
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # the T-Invest SDK warns about its own deprecated fields at import time
    "ignore:.*figi is deprecated:DeprecationWarning",
]

[tool.poe.tasks]
fmt = "ruff format"
lint = [
    { cmd = "ruff check" },
    { cmd = "lint-imports --no-logo" },
    { cmd = "lint-rules src" },
    { cmd = "vulture src dashboard.py" },
]
typecheck = "ty check"
test = "pytest"
build = "uv build"
check = ["lint", "typecheck", "test"]
dashboard = "streamlit run dashboard.py"

[dependency-groups]
dev = [
    "grind-t-lint-rules>=0.4.0",
    "import-linter>=2.15",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyxirr>=0.10.8",
    "ruff>=0.16.9",
    "streamlit>=1.65.0",
    "syrupy>=6.1.1",
    "time-machine>=3.5.1",
    "ty>=0.0.84",
    "vulture>=2.16",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "N",
    "C4", "PIE", "PERF", "FURB", "PTH", "T20", "ANN", "ASYNC", "DTZ", "TID",
]
ignore = [
    "RUF001",  # allow Cyrillic in strings
    "E501",  # ruff format wraps code, but deep import paths cannot be wrapped
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest.mark.parametrize".msg = "Use the `subtests` fixture with named cases instead."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ty.environment]
extra-paths = ["tests"]

[tool.vulture]
ignore_decorators = ["@model_validator"]
# public fields of returned entities that only library consumers read
ignore_names = ["face_value", "operation_name"]

# ---------- Architecture rules enforced by lint-imports ----------
[tool.importlinter]
root_package = "russian_bonds"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Effects -> workflows -> computations -> entities"
type = "layers"
layers = [
    "russian_bonds._stateless_effects : russian_bonds._stateful_effects",
    "russian_bonds._stateless_workflows : russian_bonds._stateful_workflows",
    "russian_bonds._stateless_computations : russian_bonds._stateful_computations",
    "russian_bonds._entities",
]
