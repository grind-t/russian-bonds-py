[project]
name = "grind-t-russian-bonds"
version = "0.1.0"
description = "Russian bonds analytics on top of T-Invest and MOEX ISS APIs"
readme = "README.md"
authors = [
    { name = "grind-t", email = "grindt.gd@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "grind-t-moex>=0.1.0",
    "grind-t-toolkit>=0.1.0",
    "httpx>=0.28.1",
    "t-tech-investments>=1.51.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "russian_bonds"

# The official T-Invest SDK is not on PyPI.
[[tool.uv.index]]
name = "tbank"
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
explicit = true

[tool.uv.sources]
t-tech-investments = { index = "tbank" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["e2e: hits the live T-Invest and MOEX ISS APIs"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyxirr>=0.10.8",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
