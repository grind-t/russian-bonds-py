[project]
name = "grind-t-russian-bonds"
version = "0.1.0"
description = "Russian bonds analytics on top of T-Invest and MOEX ISS APIs"
license = "ISC"
authors = [
    { name = "grind-t", email = "grindt.gd@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "brotli>=1.2.0",
    "grind-t-cbr-ratings>=0.1.1",
    "grind-t-moex>=0.1.0",
    "grind-t-toolkit>=0.1.0",
    "httpx>=0.28.1",
    "pydantic>=2",
    "t-tech-investments>=1.51.0",
]

[project.urls]
Homepage = "https://github.com/grind-t/russian-bonds-py"
Issues = "https://github.com/grind-t/russian-bonds-py/issues"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "russian_bonds"

[tool.uv.sources]
# The official T-Invest SDK is not on PyPI, and opensource.tbank.ru is
# temporarily unavailable, so the wheel is vendored in the repo.
t-tech-investments = { path = "vendor/t_tech_investments-1.51.0-py3-none-any.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyxirr>=0.10.8",
    "ruff>=0.16.9",
    "streamlit>=1.65.0",
    "syrupy>=6.1.1",
    "time-machine>=3.5.1",
    "ty>=0.0.84",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "N",
    "C4", "PIE", "PERF", "FURB", "PTH", "T20", "ANN", "ASYNC", "DTZ", "TID",
]
ignore = ["RUF001"]  # allow Cyrillic in strings

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
